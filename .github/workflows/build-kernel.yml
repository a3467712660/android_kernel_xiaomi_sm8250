name: Build ReSukiSU SM8250 Kernel

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Xiaomi SM8250 device config name under arch/arm64/configs/vendor/xiaomi, e.g. alioth/cmi/umi/lmi/munch"
        required: true
        default: "alioth"
      jobs:
        description: "Parallel build jobs"
        required: true
        default: "4"

jobs:
  build:
    name: Build kernel (${{ inputs.device }})
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex git libssl-dev \
            libelf-dev clang lld llvm make python3 unzip zip \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
          clang --version
          aarch64-linux-gnu-gcc --version | head -n 1

      - name: Configure kernel
        run: |
          set -euxo pipefail
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          DEVICE="${{ inputs.device }}"
          DEVICE_CONFIG="arch/arm64/configs/vendor/xiaomi/${DEVICE}.config"
          if [ ! -f "$DEVICE_CONFIG" ]; then
            echo "Device config not found: $DEVICE_CONFIG"
            echo "Available configs:"
            find arch/arm64/configs/vendor/xiaomi -maxdepth 1 -name '*.config' -printf '%f\n' | sort
            exit 1
          fi

          make O=out ARCH=arm64 vendor/kona-perf_defconfig
          COMMON_CONFIG="arch/arm64/configs/vendor/xiaomi/sm8250-common.config"
          scripts/kconfig/merge_config.sh -m -O out out/.config "$COMMON_CONFIG" "$DEVICE_CONFIG"
          make O=out ARCH=arm64 olddefconfig

          echo "Effective KSU config:"
          grep -E 'CONFIG_KSU|CONFIG_KALLSYMS_ALL|CONFIG_OVERLAY_FS|CONFIG_SECURITY_SELINUX' out/.config || true

      - name: Build kernel
        run: |
          set -o pipefail
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          JOBS="${{ inputs.jobs }}"

          make -j"$JOBS" O=out ARCH=arm64 Image.gz dtbs 2>&1 | tee build.log

      - name: Package AnyKernel3 flashable zip
        if: success()
        run: |
          set -euxo pipefail
          DEVICE="${{ inputs.device }}"
          AK3_DIR="AnyKernel3-ReSukiSU-${DEVICE}"
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git "$AK3_DIR"
          rm -rf "$AK3_DIR/.git" "$AK3_DIR/.github" "$AK3_DIR/README.md"

          cp out/arch/arm64/boot/Image.gz "$AK3_DIR/Image.gz"
          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp out/arch/arm64/boot/Image.gz-dtb "$AK3_DIR/Image.gz-dtb"
          fi

          cat > "$AK3_DIR/anykernel.sh" <<'EOF'
          ### AnyKernel3 Ramdisk Mod Script
          ## Auto-packaged ReSukiSU SM8250 kernel
          
          properties() { '
          kernel.string=ReSukiSU SM8250 Kernel by a3467712660
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=alioth
          device.name2=aliothin
          device.name3=cmi
          device.name4=umi
          device.name5=lmi
          device.name6=munch
          device.name7=apollo
          device.name8=cas
          device.name9=thyme
          device.name10=psyche
          device.name11=dagu
          device.name12=elish
          device.name13=enuma
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }
          
          boot_attributes() {
          set_perm_recursive 0 0 755 644 $RAMDISK/*;
          set_perm_recursive 0 0 750 750 $RAMDISK/init* $RAMDISK/sbin;
          }
          
          BLOCK=boot;
          IS_SLOT_DEVICE=1;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;
          
          . tools/ak3-core.sh;
          
          split_boot;
          flash_boot;
          EOF

          (cd "$AK3_DIR" && zip -r9 "../AnyKernel3-ReSukiSU-${DEVICE}-${GITHUB_RUN_NUMBER}.zip" . -x '*.git*')
          mkdir -p artifacts
          cp "AnyKernel3-ReSukiSU-${DEVICE}-${GITHUB_RUN_NUMBER}.zip" artifacts/

      - name: Collect artifacts
        if: always()
        run: |
          set +e
          mkdir -p artifacts
          cp build.log artifacts/ 2>/dev/null || true
          cp out/.config artifacts/kernel.config 2>/dev/null || true
          cp out/arch/arm64/boot/Image artifacts/ 2>/dev/null || true
          cp out/arch/arm64/boot/Image.gz artifacts/ 2>/dev/null || true
          cp out/arch/arm64/boot/Image.gz-dtb artifacts/ 2>/dev/null || true
          if [ -d out/arch/arm64/boot/dts ]; then
            mkdir -p artifacts/dts
            find out/arch/arm64/boot/dts -name '*.dtb' -o -name '*.dtbo' | xargs -r -I{} cp --parents {} artifacts/dts/
          fi
          find artifacts -maxdepth 4 -type f -printf '%p\n' | sort

      - name: Upload build artifacts and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sm8250-resukisu-${{ inputs.device }}-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn

